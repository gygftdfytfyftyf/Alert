commands:
  start_private: |
    Привет! Я бот для управления тегами в группах.

    Добавьте меня в группу и выдайте права администратора, затем используйте /menu в группе.
  start_group: "Бот готов к работе. Используйте /menu для открытия меню."
  added_to_group: |
    <b>Бот добавлен в группу!</b>

    Чтобы начать работу:
    1. Выдайте боту права <b>администратора</b>
    2. Откройте /menu и создайте теги (сапорты, провайдеры, камы…)
    3. Быстрые кнопки появятся автоматически после первого тега

    Участники, которые вышли из группы, автоматически убираются из тегов.
    Новые участники видят быстрые кнопки, если панель уже опубликована (/panel).

    <i>Рекомендация:</i> в @BotFather выполните /setprivacy → Disable — так бот увидит участников чата.
  help: |
    <b>Справка</b>

    <b>Команды:</b>
    /start — запуск бота
    /menu — панель управления (админы) или быстрые кнопки (участники)
    /tags — то же, что /menu для участников
    /panel — показать быстрые кнопки тегов
    /help — эта справка

    <b>Быстрые кнопки:</b> админ публикует их командой /panel — участники тегают одним нажатием.

    <b>Администраторы</b> и <b>назначенные редакторы</b> могут создавать теги, назначать участников и менять настройки.
    <b>Участники</b> вызывают теги кнопками внизу экрана (/panel).

    <b>Редакторы:</b> админ группы может назначить редактора в /menu → «Назначить редакторов» без выдачи админки в Telegram.

    Для корректной работы боту нужны права администратора в группе.
