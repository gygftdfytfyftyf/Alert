commands:
  start_private: |
    Привет! Я бот для управления тегами в группах.

    Добавьте меня в группу и выдайте права администратора, затем используйте /menu в группе.
  start_group: "Бот готов к работе. Используйте /menu для открытия меню."
  added_to_group: |
    <b>Бот добавлен в группу!</b>

    Чтобы начать работу:
    1. Выдайте боту права <b>администратора</b>
    2. Откройте /menu и создайте первый тег
    3. Отправьте /panel — появятся быстрые кнопки для вызова тегов

    <i>Рекомендация:</i> в @BotFather выполните /setprivacy → Disable — так бот сможет видеть участников чата.
  help: |
    <b>Справка</b>

    <b>Команды:</b>
    /start — запуск бота
    /menu — главное меню
    /tags — список тегов
    /panel — быстрые кнопки тегов внизу экрана
    /help — эта справка

    <b>Быстрые кнопки:</b> /panel — появятся кнопки тегов внизу чата. Нажмите на тег — бот упомянет всех без команд.

    <b>Администраторы</b> и <b>назначенные редакторы</b> могут создавать теги, назначать участников и менять настройки.
    <b>Участники</b> могут вызывать теги (если разрешено в настройках).

    <b>Редакторы:</b> админ группы может назначить редактора в /menu → «Назначить редакторов» без выдачи админки в Telegram.

    Для корректной работы боту нужны права администратора в группе.
  menu_title: "<b>Главное меню</b>"
  menu_title_manage: "<b>Панель управления тегами</b>"
  menu_title_call: "<b>Вызов тегов</b>"
