services:
  - type: worker
    name: aya-teg-bot
    runtime: docker
    plan: starter
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: BOT_OWNER_IDS
        sync: false
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////data/bot.db
      - key: LOG_LEVEL
        value: INFO
      - key: PORT
        value: "8080"
    disk:
      name: bot-data
      mountPath: /data
      sizeGB: 1
